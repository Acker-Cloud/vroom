<style>
/* Owner: ui. The metal grunge look (docs/OVERHAUL.md section 2): riveted gunmetal plates, chrome rims,
   rust bleeding from bolt holes, hazard stripes, molten light. Other modules add DOM only inside the mount
   points (#garageHud, #raceHud) through VROOM.ui.button and friends, never by editing here.
   Sections: 1 tokens  2 stage and layers  3 plates  4 numerals and chips  5 logo  6 splash  7 home
   8 map  9 race HUD  10 controls  11 results  12 overlays  13 shutter, toasts, grime, CRT  14 motion */

/* ---------- 1. tokens ---------- */
:root {
  --m-soot: #0d0e12; --m-iron: #1a1c21; --m-gun: #2c3039; --m-gun-2: #383d47; --m-steel: #6b727e; --m-steel-hi: #c7ccd5; --m-chrome: #f4f6fa;
  --m-rust: #8a3b12; --m-rust-hi: #c2561c; --m-hazard: #f2b705; --m-hazard-ink: #111214; --m-molten: #ff5a1a; --m-molten-hi: #ffb02e;
  --m-toxic: #8cff3a; --m-ink: #e6e9ef; --m-ink-soft: #9aa3b0; --m-go: #5fd34a; --m-go-deep: #2f7d25; --m-deny: #d8322a;
  --metal: linear-gradient(#555b66, #363a43 55%, #24272e);
  --steel: linear-gradient(#c7ccd5, #6b727e 55%, #4b515b);
  --chrome: linear-gradient(#ffffff, #c9ced8 36%, #5a616d 50%, #e3e7ee 60%, #8d94a0 82%, #c7ccd5);
  --hazard: repeating-linear-gradient(-45deg, var(--m-hazard) 0 18px, var(--m-hazard-ink) 18px 36px);
  --hazard-s: repeating-linear-gradient(-45deg, var(--m-hazard) 0 9px, var(--m-hazard-ink) 9px 18px);
  --molten: linear-gradient(var(--m-molten-hi), var(--m-molten) 55%, #b3200f);
  --acc0: #fff2a8; --acc1: #ffb02e; --acc2: #ff5a1a; --acc3: #b3200f;
  --r-plate: 10px; --shadow-plate: 0 6px 0 #050608, 0 12px 22px rgba(0, 0, 0, .5);
  --font: "Arial Black", "Helvetica Neue", Arial, Impact, system-ui, sans-serif;
  --rivet: #eef1f5 0 1.5px, #8d94a0 2.6px, #2c3039 4.4px, rgba(0, 0, 0, .55) 5.4px, transparent 6.4px;
  --o3: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000, 0 -3px 0 #000, 0 3px 0 #000, -3px 0 0 #000, 3px 0 0 #000;
}

/* ---------- 2. stage and layers ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--m-soot); touch-action: none; }
#stage { position: absolute; left: 50%; top: 50%; width: 1200px; height: 700px; transform-origin: 50% 50%; overflow: hidden;
  background: var(--m-soot); font-family: var(--font); color: var(--m-ink); }
#view { position: absolute; inset: 0; width: 1200px; height: 700px; display: block; touch-action: none; }
.scene { position: absolute; inset: 0; display: none; pointer-events: none; }
.scene.active { display: block; }
.scene button, .scene .live { pointer-events: auto; }
.hud { position: absolute; inset: 0; }
svg { display: block; overflow: visible; }

/* ---------- 3. plates: riveted gunmetal, a steel bevel rim, rust from the bolt holes, a hard drop ---------- */
.plate { --face: var(--metal); position: absolute; width: 96px; height: 96px; padding: 0; margin: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;
  color: var(--m-ink); font: italic 900 40px/1 var(--font); border: 3px solid #050608; border-radius: var(--r-plate); outline: none;
  background:
    radial-gradient(circle at 13px 13px, var(--rivet)), radial-gradient(circle at calc(100% - 13px) 13px, var(--rivet)),
    radial-gradient(circle at 13px calc(100% - 13px), var(--rivet)), radial-gradient(circle at calc(100% - 13px) calc(100% - 13px), var(--rivet)),
    radial-gradient(ellipse 8px 22px at 13px 28px, rgba(194, 86, 28, .5), transparent 70%),
    radial-gradient(ellipse 10px 16px at calc(100% - 13px) 100%, rgba(138, 59, 18, .6), transparent 70%),
    radial-gradient(ellipse 40% 30% at 85% 92%, rgba(13, 14, 18, .45), transparent 70%),
    repeating-linear-gradient(102deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 5px),
    radial-gradient(ellipse 80% 55% at 25% 0%, rgba(255, 255, 255, .16), transparent 60%),
    var(--face);
  box-shadow: inset 0 0 0 3px #737a86, inset 0 3px 0 3px #d3d8e0, inset 0 -3px 0 3px #30343c, 0 6px 0 #050608, 0 12px 22px rgba(0, 0, 0, .5);
  transition: transform .06s, box-shadow .06s, filter .2s; }
.plate > * { pointer-events: none; }
.plate svg { width: 58%; height: 58%; max-width: 96px; max-height: 96px; flex: none; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .55)); }
.plate.pressed, .plate:active { transform: translateY(4px);
  box-shadow: inset 0 0 0 3px #737a86, inset 0 3px 0 3px #d3d8e0, inset 0 -3px 0 3px #30343c, 0 2px 0 #050608, 0 4px 10px rgba(0, 0, 0, .5); }
.plate:focus-visible { box-shadow: inset 0 0 0 3px #737a86, 0 0 0 4px var(--m-molten-hi), 0 6px 0 #050608; }
.plate.on { box-shadow: inset 0 0 0 3px var(--m-molten-hi), inset 0 3px 0 3px #ffe0a0, inset 0 -3px 0 3px #7a2a08, 0 6px 0 #050608, 0 0 26px var(--acc2), 0 0 6px var(--acc1); }
.plate.go { --face: linear-gradient(#7ccf68, var(--m-go) 38%, #3f9a30 70%, var(--m-go-deep)); border: 12px solid transparent; border-radius: 14px;
  background: radial-gradient(ellipse 80% 55% at 25% 0%, rgba(255, 255, 255, .28), transparent 60%) padding-box,
    radial-gradient(ellipse 30% 40% at 92% 96%, rgba(13, 14, 18, .5), transparent 70%) padding-box, radial-gradient(ellipse 18% 30% at 4% 80%, rgba(13, 14, 18, .4), transparent 70%) padding-box,
    repeating-linear-gradient(170deg, transparent 0 22px, rgba(255, 255, 255, .07) 22px 23px, transparent 23px 61px) padding-box,
    repeating-linear-gradient(102deg, rgba(0, 0, 0, .06) 0 1px, transparent 1px 5px) padding-box, var(--face) padding-box, var(--hazard-s) border-box;
  box-shadow: inset 0 0 0 3px #050608, inset 0 5px 0 3px rgba(255, 255, 255, .35), inset 0 -6px 0 3px rgba(0, 0, 0, .3), 0 0 0 3px #050608, 0 8px 0 3px #050608, 0 0 34px rgba(95, 211, 74, .35); }
.plate.go.pressed, .plate.go:active { box-shadow: inset 0 0 0 3px #050608, 0 0 0 3px #050608, 0 3px 0 3px #050608; }
.plate.go svg { filter: drop-shadow(0 4px 0 rgba(0, 0, 0, .45)); }
.plate.molten { --face: linear-gradient(#ffd06a, var(--m-molten-hi) 30%, var(--m-molten) 65%, #9a1c0a); }
.plate.red { --face: linear-gradient(#f26a5c, var(--m-deny) 50%, #7d130e); }
.plate.dark { --face: linear-gradient(#3a3f48, #1f2228 60%, #15171c); }
.plate.locked { --face: linear-gradient(#5a4234, #3a2a22 50%, #241812); filter: saturate(.55) brightness(.8); color: var(--m-ink-soft); }
.plate.locked::after { content: ''; position: absolute; inset: 0; border-radius: 7px; pointer-events: none;
  background: radial-gradient(ellipse 30% 20% at 70% 30%, rgba(194, 86, 28, .5), transparent), radial-gradient(ellipse 25% 35% at 20% 80%, rgba(138, 59, 18, .6), transparent),
    repeating-linear-gradient(-45deg, rgba(242, 183, 5, .14) 0 10px, transparent 10px 20px); }
.plate.deny { animation: deny .34s; }
.plate.ghost { background: transparent; border-color: transparent; box-shadow: none; }
.plate.ghost.pressed { transform: none; }
.plate .n { font-size: 44px; }
@keyframes deny { 20% { translate: -10px 0; } 40% { translate: 9px 0; } 60% { translate: -6px 0; } 80% { translate: 4px 0; } }
.slam { animation: slamIn .34s var(--d, 0s) cubic-bezier(.2, 1.5, .4, 1) both; }
@keyframes slamIn { from { opacity: 0; transform: translateY(-46px) scale(1.18); } 60% { opacity: 1; } }
.rise { animation: riseIn .4s var(--d, 0s) cubic-bezier(.2, 1.3, .4, 1) both; }
@keyframes riseIn { from { opacity: 0; transform: translateY(60px); } }
/* a panel: the same plate, bigger, not a button */
.panel { position: absolute; border: 3px solid #050608; border-radius: 12px;
  background:
    radial-gradient(circle at 16px 16px, var(--rivet)), radial-gradient(circle at calc(100% - 16px) 16px, var(--rivet)),
    radial-gradient(circle at 16px calc(100% - 16px), var(--rivet)), radial-gradient(circle at calc(100% - 16px) calc(100% - 16px), var(--rivet)),
    radial-gradient(ellipse 10px 40px at 16px 40px, rgba(194, 86, 28, .45), transparent 70%),
    radial-gradient(ellipse 120px 40px at 80% 100%, rgba(138, 59, 18, .45), transparent 70%),
    radial-gradient(ellipse 30% 25% at 10% 96%, rgba(13, 14, 18, .6), transparent 70%),
    repeating-linear-gradient(98deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 6px),
    radial-gradient(ellipse 70% 45% at 30% 0%, rgba(255, 255, 255, .12), transparent 60%),
    linear-gradient(#4a505b, #30343d 45%, #1f2228);
  box-shadow: inset 0 0 0 4px #737a86, inset 0 4px 0 4px #c7ccd5, inset 0 -4px 0 4px #2a2d34, 0 8px 0 #050608, 0 18px 40px rgba(0, 0, 0, .6); }
.panel.glow { box-shadow: inset 0 0 0 4px #737a86, inset 0 4px 0 4px #c7ccd5, inset 0 -4px 0 4px #2a2d34, 0 8px 0 #050608, 0 0 40px var(--acc2); }
.stripe { position: absolute; height: 18px; background: var(--hazard-s); border: 3px solid #050608; border-radius: 4px; }

/* ---------- 4. numerals and chips ---------- */
.n { font: italic 900 44px/1 var(--font); color: #fff; letter-spacing: .5px; white-space: nowrap; text-shadow: var(--o3), 0 7px 0 #000; }
.n.s { font-size: 28px; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 4px 0 #000; }
.n.hot { color: var(--m-molten-hi); }
.n.gold { color: #ffd02e; }
.n.toxic { color: var(--m-toxic); }
.chip { position: absolute; display: flex; align-items: center; gap: 10px; padding: 0 18px 0 12px; height: 76px; border-radius: 10px;
  background: radial-gradient(circle at 10px 50%, var(--rivet)), radial-gradient(circle at calc(100% - 10px) 50%, var(--rivet)), linear-gradient(rgba(26, 28, 33, .92), rgba(13, 14, 18, .92));
  border: 3px solid #050608; box-shadow: inset 0 0 0 3px #5a616d, inset 0 3px 0 3px #8d94a0, 0 5px 0 #050608, 0 10px 18px rgba(0, 0, 0, .45); }
.chip svg { width: 46px; height: 46px; flex: none; }
.chip.pop { animation: pop .3s cubic-bezier(.2, 1.8, .4, 1); }
@keyframes pop { 40% { transform: scale(1.18); } }

/* ---------- 5. the VROOM logo: chrome face, a black cut-out, a ten-step extrusion into molten, cracked plates behind ---------- */
.logo { position: absolute; white-space: nowrap; font: italic 900 172px/1 var(--font); letter-spacing: -4px; rotate: -6deg; pointer-events: none; will-change: transform; }
.logo::before { content: ''; position: absolute; left: 4%; right: 4%; top: 30%; bottom: -12%; border-radius: 50%; pointer-events: none;
  background: radial-gradient(ellipse at 50% 50%, rgba(255, 90, 26, .55), rgba(255, 90, 26, .18) 45%, transparent 70%); }
.logo .plates { position: absolute; left: -8%; top: -24%; width: 116%; height: 148%; }
.logo .back, .logo .front { position: relative; white-space: nowrap; padding: 0 .12em; }
.logo .front { position: absolute; left: 0; top: 0; }
.logo span { display: inline-block; }
.logo .back span { color: #000; -webkit-text-stroke: .075em #000;
  text-shadow: .006em .006em 0 #2a1208, .012em .014em 0 #3d1609, .018em .022em 0 #561c09, .024em .03em 0 #74220a, .03em .038em 0 #94290b,
    .036em .046em 0 #b8320d, .042em .054em 0 #d94111, .048em .062em 0 #f25317, .054em .07em 0 #ff6a1e, .06em .078em 0 #ff8c26; }
.logo .front span { color: transparent; -webkit-background-clip: text; background-clip: text; -webkit-text-stroke: .006em rgba(0, 0, 0, .6);
  background-image: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, .85) 49%, rgba(255, 255, 255, .2) 52%, transparent 60%), var(--chrome);
  background-size: 320% 100%, 100% 100%; background-position: 170% 0, 0 0; animation: glint 4.6s 1.6s ease-in-out infinite; }
.logo .front span.o { background-image: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, .85) 49%, rgba(255, 255, 255, .2) 52%, transparent 60%),
  radial-gradient(circle at 50% 55%, #fff6c8 0 12%, var(--m-molten-hi) 30%, var(--m-molten) 58%, #8a1a06 88%); }
@keyframes glint { 0%, 62% { background-position: 170% 0, 0 0; } 100% { background-position: -70% 0, 0 0; } }
#logo { left: 0; right: 0; top: 214px; margin: 0 auto; width: max-content; }
#homeLogo { left: 36px; top: 26px; font-size: 118px; letter-spacing: -3px; }

/* ---------- 6. splash: an original foundry sting, then the logo smashes through a steel plate ---------- */
#splash { background: radial-gradient(ellipse 70% 50% at 50% 110%, rgba(255, 90, 26, .32), transparent 70%), radial-gradient(ellipse at 50% 45%, #1a1c21, #050608 75%); pointer-events: auto; }
#splashFx { position: absolute; inset: 0; width: 1200px; height: 700px; pointer-events: none; }
#sting { position: absolute; left: 450px; top: 170px; width: 300px; height: 300px; opacity: 0; }
#sting svg { width: 100%; height: 100%; }
#sting .hammer { transform-origin: 262px 128px; transform-box: view-box; }
#splash.s1 #sting { opacity: 1; }
#splash.s1 #sting .hammer { animation: hammer .34s cubic-bezier(.7, 0, 1, .6) both; }
#splash.s1 #sting .anvil { animation: anvilHit .5s .3s both; }
#splash.s2 #sting { opacity: 0; transition: opacity .2s; }
@keyframes hammer { from { transform: rotate(68deg); } 70% { transform: rotate(-4deg); } to { transform: rotate(0); } }
@keyframes anvilHit { 0% { filter: brightness(2.4); } 100% { filter: none; } }
#splashPlate { position: absolute; left: 130px; top: 140px; width: 940px; height: 380px; opacity: 0; }
#splash.s3 #splashPlate { opacity: 1; animation: plateHit .5s .2s both; }
@keyframes plateHit { 0% { transform: scale(1.06); } 100% { transform: none; } }
#splashPlate .crack { stroke-dasharray: 600; stroke-dashoffset: 600; }
#splash.s3 #splashPlate .crack { animation: crack .5s .22s ease-out forwards; }
@keyframes crack { to { stroke-dashoffset: 0; } }
#splash #logo { opacity: 0; }
#splash.s3 #logo { opacity: 1; animation: logoSlam .24s cubic-bezier(.6, 0, .9, .4) both; }
@keyframes logoSlam { from { transform: scale(4.2); opacity: 0; } 60% { opacity: 1; } to { transform: none; } }
#splash { will-change: transform; }
#splash.shake { animation: shake .42s; }
@keyframes shake { 10% { translate: -14px 8px; } 25% { translate: 12px -10px; } 40% { translate: -9px 6px; } 55% { translate: 7px -4px; } 75% { translate: -3px 2px; } }
#splashFlash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #fff, #ffd06a 30%, rgba(255, 90, 26, 0) 70%); opacity: 0; pointer-events: none; }
#splashFlash.on { animation: flash .38s ease-out; }
@keyframes flash { from { opacity: .95; } to { opacity: 0; } }
#splash .stripe { left: 0; right: 0; bottom: 0; height: 26px; border-radius: 0; border-width: 3px 0 0; opacity: 0; }
#splash.s3 .stripe { opacity: 1; animation: riseIn .3s .3s both; }

/* ---------- 7. home ---------- */
#home .scrim { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(5, 6, 8, .72), rgba(5, 6, 8, .25) 46%, transparent 62%), linear-gradient(transparent 70%, rgba(5, 6, 8, .55)); }
#home .wod { left: 60px; top: 214px; }
#home .wod svg.em { width: 52px; height: 52px; }
#homeGo { left: 56px; top: 312px; width: 380px; height: 172px; }
#homeGo svg { width: 92px; height: 92px; }
#homeGo .gl { position: absolute; right: 28px; bottom: 18px; }
#homeGo .boss { position: absolute; left: 22px; top: 16px; width: 46px; height: 46px; }
#homeGo.pulse { animation: goPulse 1.7s 1s ease-in-out infinite; }
@keyframes goPulse { 50% { box-shadow: inset 0 0 0 3px #050608, 0 0 0 3px #050608, 0 8px 0 3px #050608, 0 0 54px rgba(140, 255, 58, .55); } }
#homeRev { left: 640px; top: 240px; width: 520px; height: 400px; }
#home .podiumGlow { position: absolute; left: 650px; top: 520px; width: 500px; height: 120px; pointer-events: none;
  background: radial-gradient(ellipse at 50% 50%, rgba(255, 90, 26, .35), transparent 70%); }

/* ---------- 8. map ---------- */
#map .scrim { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(rgba(5, 6, 8, .55), rgba(5, 6, 8, .1) 30%, rgba(5, 6, 8, .2) 75%, rgba(5, 6, 8, .85)); }
#map .route { position: absolute; left: 0; top: 0; width: 1200px; height: 700px; pointer-events: none; }
#map .head { left: 140px; top: 20px; }
#map .head svg.em { width: 56px; height: 56px; }
.lvl { width: 118px; height: 118px; }
.lvl .n { font-size: 46px; margin-top: -14px; }
.lvl .pips { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; gap: 2px; }
.lvl .pips svg { width: 24px; height: 24px; filter: none; }
.lvl .medal { position: absolute; right: -16px; top: -16px; width: 46px; height: 46px; filter: drop-shadow(0 3px 0 #000); }
.lvl .ic { width: 52px; height: 52px; }
.lvl.boss { width: 148px; height: 148px; border: 10px solid transparent;
  background: radial-gradient(ellipse 80% 55% at 25% 0%, rgba(255, 255, 255, .16), transparent 60%) padding-box, var(--metal) padding-box, var(--hazard-s) border-box;
  box-shadow: inset 0 0 0 3px #050608, 0 0 0 3px #050608, 0 8px 0 3px #050608, 0 0 30px var(--acc2); }
.lvl.boss .skull { position: absolute; left: 50%; top: 10px; width: 58px; height: 58px; translate: -50% 0; }
.lvl.boss .n { margin-top: 56px; font-size: 34px; }
.lvl.boss.locked { filter: saturate(.5) brightness(.75); }
.lvl.next { animation: nextGlow 1.6s ease-in-out infinite; }
@keyframes nextGlow { 50% { box-shadow: inset 0 0 0 3px var(--m-molten-hi), 0 6px 0 #050608, 0 0 34px var(--acc1); } }
.tab { width: 88px; height: 88px; }
.tab svg.em { width: 52px; height: 52px; margin-top: -10px; }
.tab .n { position: absolute; right: 8px; bottom: 4px; font-size: 22px; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 3px 0 #000; }
.tab .lk { position: absolute; width: 40px; height: 40px; filter: drop-shadow(0 2px 0 #000); }
.tab.locked svg.em { opacity: .35; filter: grayscale(1); }
.tab.on { transform: translateY(-10px); }

/* ---------- 9. race HUD ---------- */
#raceHud .top { position: absolute; left: 0; right: 0; top: 0; height: 120px; pointer-events: none; background: linear-gradient(rgba(5, 6, 8, .5), transparent); }
#hTime { left: 470px; top: 14px; width: 260px; justify-content: center; padding: 0 14px; }
#hTime .n { font-size: 40px; font-variant-numeric: tabular-nums; }
#hStars { right: 20px; top: 16px; }
#hRail { position: absolute; left: 330px; top: 102px; width: 540px; height: 34px; pointer-events: none; }
#hRail .bar { position: absolute; left: 0; right: 0; top: 11px; height: 12px; border-radius: 6px; background: linear-gradient(#15171c, #30343c); border: 2px solid #050608; box-shadow: 0 0 0 2px #6b727e; }
#hRail .fill { position: absolute; left: 2px; top: 13px; height: 8px; border-radius: 4px; background: var(--molten); box-shadow: 0 0 10px var(--acc2); width: 0; }
#hRail .cp { position: absolute; top: 4px; width: 6px; height: 26px; margin-left: -3px; background: #6b727e; border: 2px solid #050608; border-radius: 2px; }
#hRail .cp.on { background: var(--m-toxic); box-shadow: 0 0 10px var(--m-toxic); }
#hRail .mk { position: absolute; top: -9px; width: 44px; height: 44px; margin-left: -22px; }
#hRail .mk.ghost { opacity: .5; }
#hRail .flag { position: absolute; right: -24px; top: -10px; width: 40px; height: 40px; }
#hBoss { position: absolute; left: 400px; top: 148px; width: 400px; height: 46px; display: none; pointer-events: none; }
#hBoss.on { display: block; animation: slamIn .3s both; }
#hBoss .frame { position: absolute; left: 44px; right: 0; top: 10px; height: 26px; border-radius: 6px; border: 3px solid #050608; background: var(--hazard-s); box-shadow: 0 0 0 2px #6b727e; overflow: hidden; }
#hBoss .heat { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--m-molten-hi), var(--m-deny)); box-shadow: 0 0 14px var(--m-deny); }
#hBoss .skull { position: absolute; left: 0; top: 0; width: 46px; height: 46px; }
#hBoss.hot .frame { animation: bossHot .35s infinite alternate; }
@keyframes bossHot { to { box-shadow: 0 0 0 2px #6b727e, 0 0 22px var(--m-deny); } }
#hBoss.dead { filter: grayscale(1) brightness(.7); }
#hGauge { position: absolute; left: 24px; top: 112px; width: 210px; height: 210px; pointer-events: none; }
#hGauge .needle { transform-box: view-box; transform-origin: 105px 112px; transform: rotate(-130deg); transition: transform .08s linear; }
#hGauge .kmh { position: absolute; left: 0; right: 0; top: 96px; text-align: center; font-size: 40px; }
#hGauge .gear { position: absolute; left: 0; right: 0; top: 146px; text-align: center; font-size: 24px; color: var(--m-molten-hi); }
#hBoost { position: absolute; left: 9px; top: 326px; width: 240px; height: 30px; display: flex; gap: 3px; padding: 4px; border-radius: 6px; pointer-events: none;
  background: #0d0e12; border: 3px solid #050608; box-shadow: 0 0 0 2px #6b727e; }
#hBoost i { flex: 1; border-radius: 2px; background: #2a2d34; }
#hBoost i.on { background: var(--molten); box-shadow: 0 0 6px var(--acc2); }
#hBoost.burn i.on { background: linear-gradient(#fff6c8, var(--m-molten-hi)); box-shadow: 0 0 14px var(--m-molten-hi); }
#hBoost.fill { animation: boostFill .5s; }
@keyframes boostFill { 30% { box-shadow: 0 0 0 2px var(--m-toxic), 0 0 24px var(--m-toxic); } }
#hPop { position: absolute; left: 0; right: 0; top: 214px; display: flex; justify-content: center; align-items: center; gap: 14px; pointer-events: none; opacity: 0; }
#hPop svg { width: 96px; height: 96px; filter: drop-shadow(0 5px 0 #000); }
#hPop .n { font-size: 64px; }
#hPop.on { animation: hudPop 1.1s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes hudPop { 0% { opacity: 0; transform: scale(2.2); } 14% { opacity: 1; transform: scale(.94); } 22% { transform: none; } 78% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }
#hLive { position: absolute; left: 0; right: 0; top: 150px; display: flex; justify-content: center; align-items: center; gap: 10px; pointer-events: none; opacity: 0; transition: opacity .15s; }
#hLive.on { opacity: 1; }
#hLive svg { width: 54px; height: 54px; }
#hSplit { position: absolute; left: 0; right: 0; top: 152px; text-align: center; pointer-events: none; opacity: 0; }
#hSplit.on { animation: hudPop 1.4s both; }
#hCount { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
#hCount .n { font-size: 260px; color: transparent; -webkit-background-clip: text; background-clip: text; background-image: var(--chrome); text-shadow: none;
  -webkit-text-stroke: 6px #000; filter: drop-shadow(0 10px 0 #000) drop-shadow(0 0 30px var(--acc2)); }
#hCount .n.on { animation: countIn .6s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes countIn { from { transform: scale(3); opacity: 0; } 30% { opacity: 1; transform: scale(.92); } 45% { transform: none; } 85% { opacity: 1; } to { opacity: 0; transform: scale(.8); } }
#hLights { position: absolute; left: 470px; top: 140px; width: 260px; height: 92px; display: flex; gap: 14px; justify-content: center; align-items: center; padding: 10px; pointer-events: none; }
#hLights i { width: 62px; height: 62px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a2a20, #1a0c08); border: 4px solid #050608; box-shadow: 0 0 0 3px #6b727e; }
#hLights i.r { background: radial-gradient(circle at 35% 30%, #ffd0c0, #ff3a1a 40%, #8a1000); box-shadow: 0 0 0 3px #6b727e, 0 0 30px #ff3a1a; }
#hLights i.g { background: radial-gradient(circle at 35% 30%, #e8ffd0, var(--m-toxic) 40%, #2f7d25); box-shadow: 0 0 0 3px #6b727e, 0 0 36px var(--m-toxic); }
#hLights.off { opacity: 0; transition: opacity .4s .4s; }
#hFlash { position: absolute; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 120px 30px rgba(216, 50, 42, .85); }
#hFlash.on { animation: flash .45s ease-out; }
#hFlash.haz { box-shadow: inset 0 0 120px 30px rgba(242, 183, 5, .8); }
#hSpeed { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: radial-gradient(ellipse 60% 56% at 50% 52%, transparent 56%, rgba(255, 90, 26, .38) 78%, rgba(255, 176, 46, .6)),
    repeating-conic-gradient(from 0deg at 50% 52%, transparent 0 3deg, rgba(255, 228, 170, .16) 3deg 4deg); }
#hSpeed.on { opacity: 1; }
#hCrane { position: absolute; left: 520px; top: 0; width: 160px; height: 300px; pointer-events: none; opacity: 0; }
#hCrane.on { animation: craneDrop 1.6s both; }
@keyframes craneDrop { 0% { opacity: 1; transform: translateY(-300px); } 30% { transform: translateY(0); } 70% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-300px); } }
#hFinish { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; }
#hFinish svg { width: 360px; height: 260px; filter: drop-shadow(0 10px 0 #000); }
#hFinish.on { animation: finishSlam 1.2s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes finishSlam { from { opacity: 0; transform: scale(2.6) rotate(-14deg); } 25% { opacity: 1; transform: rotate(-6deg); } to { opacity: 1; transform: rotate(-6deg); } }
#raceHud.shake { animation: shake .36s; }
#hPause { left: 20px; top: 16px; width: 88px; height: 88px; }

/* ---------- 10. controls ---------- */
#ctl { position: absolute; inset: 0; pointer-events: none; transition: opacity .25s; }
#ctl.dim { opacity: .25; }
#ctlSteer { position: absolute; left: 0; top: 200px; width: 470px; height: 500px; pointer-events: auto; touch-action: none; }
#ctlKnob { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; display: none; pointer-events: none;
  background: radial-gradient(circle at 35% 30%, #9aa1ad, #3a3f48 60%, #1a1c21); border: 4px solid #050608; box-shadow: 0 0 0 3px #6b727e, 0 0 24px var(--acc2); }
#ctlKnob.on { display: block; }
#ctlTrack { position: absolute; height: 18px; width: 300px; margin: -9px 0 0 -150px; border-radius: 9px; display: none; pointer-events: none;
  background: var(--hazard-s); border: 3px solid #050608; opacity: .55; }
#ctlTrack.on { display: block; }
.pedal { touch-action: none; }
.pedal.held { transform: translateY(5px) scale(.97); filter: brightness(1.2); }
#ctlGas { right: 24px; bottom: 22px; width: 168px; height: 188px; }
#ctlGas svg { width: 70%; height: 70%; }
#ctlBrake { right: 214px; bottom: 22px; width: 124px; height: 132px; }
#ctlBoost { right: 34px; bottom: 234px; width: 130px; height: 118px; }
#ctlBoost.ready { box-shadow: inset 0 0 0 3px var(--m-molten-hi), 0 6px 0 #050608, 0 0 26px var(--acc2); }
#ctlDrift { right: 214px; bottom: 176px; width: 124px; height: 110px; }
#ctlL { left: 24px; bottom: 22px; width: 150px; height: 150px; }
#ctlR { left: 194px; bottom: 22px; width: 150px; height: 150px; }

/* ---------- 11. results ---------- */
#results .scrim { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, rgba(5, 6, 8, .25), rgba(5, 6, 8, .82)); }
#rCard { left: 190px; top: 54px; width: 820px; height: 432px; }
#rCard.slam { animation: cardSlam .42s cubic-bezier(.3, 1.4, .5, 1) both; }
@keyframes cardSlam { from { transform: translateY(-640px) rotate(-4deg); } 70% { transform: translateY(10px) rotate(.6deg); } }
#rCard .stripe { left: 30px; right: 30px; top: 22px; }
#rMedal { position: absolute; left: 40px; top: 66px; width: 230px; height: 230px; }
#rMedal.stamp { animation: stamp .45s .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stamp { from { opacity: 0; transform: scale(3) rotate(-30deg); } to { opacity: 1; transform: rotate(-8deg); } }
#rMedal svg { width: 100%; height: 100%; filter: drop-shadow(0 8px 0 #000); }
#rRating { position: absolute; left: 34px; top: 310px; width: 250px; display: flex; justify-content: center; gap: 4px; }
#rRating svg { width: 74px; height: 74px; filter: drop-shadow(0 4px 0 #000); }
#rRating svg:nth-child(2) { translate: 0 -12px; }
#rRating svg.off { opacity: .28; filter: grayscale(1) drop-shadow(0 4px 0 #000); }
#rRating svg.on { animation: starIn .4s var(--d) cubic-bezier(.2, 1.8, .4, 1) both; }
@keyframes starIn { from { transform: scale(0) rotate(-90deg); } }
#rTime { position: absolute; left: 310px; top: 66px; display: flex; align-items: center; gap: 16px; }
#rTime svg { width: 70px; height: 70px; }
#rTime .n { font-size: 78px; font-variant-numeric: tabular-nums; }
#rBest { position: absolute; left: 650px; top: 158px; width: 124px; height: 124px; opacity: 0; }
#rBest.on { animation: stamp .5s 1.1s cubic-bezier(.2, 1.6, .4, 1) both; }
#rStars { position: absolute; left: 316px; top: 184px; display: flex; align-items: center; gap: 12px; }
#rStars svg { width: 58px; height: 58px; }
#rStats { position: absolute; left: 304px; top: 280px; display: flex; gap: 8px; }
#rStats .st { display: flex; align-items: center; gap: 4px; padding: 6px 10px 6px 6px; border-radius: 8px; background: rgba(5, 6, 8, .5); border: 2px solid #4b515b; }
#rStats .st .n { font-size: 24px; }
#rStats svg { width: 36px; height: 36px; }
#rPay { position: absolute; left: 316px; top: 350px; display: flex; align-items: center; gap: 14px; }
#rPay svg { width: 54px; height: 54px; }
#rBoss { position: absolute; right: 36px; bottom: 30px; width: 120px; height: 120px; opacity: 0; }
#rBoss.on { animation: stamp .5s 1.4s cubic-bezier(.2, 1.6, .4, 1) both; }
#rWallet { right: 20px; top: 20px; }
#rWallet.pop { animation: pop .25s; }

/* ---------- 12. overlays: pause, settings, profiles, album, the code import ---------- */
#ovl { position: absolute; inset: 0; display: none; z-index: 40; pointer-events: auto; background: rgba(5, 6, 8, .72); }
#ovl.open { display: block; }
#ovl.open .panel { animation: cardSlam .34s cubic-bezier(.3, 1.4, .5, 1) both; }
#ovl .close { right: 26px; top: 22px; }
.pcard { width: 250px; height: 300px; }
.pcard .av { width: 150px; height: 150px; margin-top: -30px; }
.pcard .n { position: absolute; left: 20px; bottom: 16px; font-size: 30px; }
.pcard .wl { position: absolute; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 6px; }
.pcard .wl svg { width: 34px; height: 34px; filter: none; max-width: none; }
.pcard.empty { --face: linear-gradient(rgba(44, 48, 57, .6), rgba(26, 28, 33, .6)); }
.pcard.empty .av { opacity: .5; }
#ovl .qr { position: absolute; background: #f4f6fa; border: 4px solid #050608; border-radius: 8px; box-shadow: 0 0 0 4px #6b727e, 0 6px 0 4px #050608; padding: 10px; }
#ovl .qr svg { width: 100%; height: 100%; }
#ovl textarea { position: absolute; left: 300px; top: 300px; width: 600px; height: 120px; border-radius: 8px; border: 4px solid #6b727e; background: #0d0e12; color: var(--m-ink);
  font: 16px/1.3 monospace; padding: 10px; resize: none; user-select: text; -webkit-user-select: text; pointer-events: auto; }
.badge { position: absolute; width: 120px; height: 120px; border-radius: 14px; display: grid; place-items: center;
  background: radial-gradient(circle at 50% 40%, #3a3f48, #15171c); border: 3px solid #050608; box-shadow: inset 0 0 0 3px #4b515b; }
.badge svg { width: 76px; height: 76px; }
.badge.off svg { opacity: .2; filter: grayscale(1); }
.badge.on { box-shadow: inset 0 0 0 3px var(--m-molten-hi), 0 0 18px var(--acc2); }
.sens { position: absolute; display: flex; gap: 8px; }
.sens i { width: 26px; height: 40px; border-radius: 4px; background: #2a2d34; border: 2px solid #050608; }
.sens i.on { background: var(--molten); box-shadow: 0 0 8px var(--acc2); }

/* ---------- 13. shutter, toasts, grime, CRT ---------- */
#shutter { position: absolute; inset: 0; z-index: 60; pointer-events: none; }
#shutter .sh { position: absolute; left: 0; right: 0; height: 352px; transition: transform .17s cubic-bezier(.7, 0, 1, .7);
  background: radial-gradient(circle at 30px 30px, var(--rivet)), radial-gradient(circle at calc(100% - 30px) 30px, var(--rivet)),
    repeating-linear-gradient(90deg, rgba(0, 0, 0, .18) 0 2px, transparent 2px 150px),
    repeating-linear-gradient(100deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 6px), linear-gradient(#4a505b, #2c3039 60%, #1a1c21); }
#shutter .top { top: 0; transform: translateY(-104%); border-bottom: 34px solid; border-image: var(--hazard) 1; }
#shutter .bot { bottom: 0; transform: translateY(104%); border-top: 34px solid; border-image: var(--hazard) 1; }
#shutter.shut { pointer-events: auto; }
#shutter.shut .sh { transform: none; }
#shutter.open .sh { transition: transform .22s cubic-bezier(.3, 0, .2, 1); }
#shutter .bolt { position: absolute; left: 560px; top: 310px; width: 80px; height: 80px; opacity: 0; transition: opacity .1s; }
#shutter.shut .bolt { opacity: 1; }
#shutter.fade { pointer-events: auto; background: #050608; animation: fadeIO .3s both; }
#shutter.fade .sh, #shutter.fade .bolt { display: none; }
@keyframes fadeIO { 50% { opacity: 1; } from, to { opacity: 0; } }
#toasts { position: absolute; right: 20px; top: 130px; z-index: 55; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; pointer-events: none; }
.toast { position: relative; width: 120px; height: 104px; display: grid; place-items: center; }
.toast svg { width: 66px; height: 66px; }
.toast.in { animation: slamIn .3s cubic-bezier(.2, 1.5, .4, 1) both; }
.toast.out { animation: toastOut .3s both; }
@keyframes toastOut { to { opacity: 0; transform: translateX(60px); } }
#grime { position: absolute; inset: 0; z-index: 70; pointer-events: none; will-change: opacity;
  background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 62%, rgba(5, 6, 8, .5)); }
#stage.racing #grime { display: none; }
#grime.grain { background-image: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 62%, rgba(5, 6, 8, .5)), var(--grain); }
#crt { position: absolute; inset: 0; z-index: 71; pointer-events: none; display: none;
  background: repeating-linear-gradient(transparent 0 2px, rgba(0, 0, 0, .28) 2px 3px), radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(0, 0, 0, .55));
  box-shadow: inset 0 0 120px rgba(0, 0, 0, .7); }
#stage.crt #crt { display: block; }
#stage.crt #view { filter: saturate(1.25) contrast(1.08); }
#rotate { position: fixed; inset: 0; display: none; place-items: center; background: var(--m-soot); z-index: 99; }
@media (orientation: portrait) { #rotate { display: grid; } }

/* ---------- 14. reduced motion: decorative motion off, gameplay feedback stays as plain state changes ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  #splash.s3 #logo, #splash.s3 #splashPlate, #splash.s3 .stripe { opacity: 1; }
  #splashPlate .crack { stroke-dashoffset: 0; }
  #hPop.on, #hSplit.on, #hFinish.on, #rMedal, #rBest.on, #rBoss.on { opacity: 1; }
  #rMedal { transform: rotate(-8deg); }
  #hCount .n.on { opacity: 1; }
  #hCount .n:not(.on) { opacity: 0; }
}
</style>
</head>
