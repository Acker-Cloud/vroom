<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- VROOM app icon (13.0): a riveted gunmetal plate with a chrome V stepping down into molten orange,
       a hazard stripe along the bottom. Metal grunge palette: soot #0d0e12, gun #2c3039, steel #6b727e / #c7ccd5,
       chrome #f4f6fa, rust #8a3b12, hazard #f2b705, molten #ff5a1a / #ffb02e.
       Everything that matters sits inside the 80% maskable safe zone (51..461). -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555b66"/><stop offset=".55" stop-color="#363a43"/><stop offset="1" stop-color="#1a1c21"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".38" stop-color="#c7ccd5"/><stop offset=".5" stop-color="#5b616c"/>
      <stop offset=".62" stop-color="#e6e9ef"/><stop offset="1" stop-color="#8d939e"/>
    </linearGradient>
    <linearGradient id="molten" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb02e"/><stop offset="1" stop-color="#b3200f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".85" r=".6">
      <stop offset="0" stop-color="#ff5a1a" stop-opacity=".55"/><stop offset="1" stop-color="#ff5a1a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="haz" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="48" height="48" fill="#111214"/><rect width="24" height="48" fill="#f2b705"/>
    </pattern>
    <clipPath id="sq"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="#0d0e12"/>
    <rect width="512" height="512" fill="url(#plate)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- brushed steel hairlines -->
    <g stroke="#ffffff" stroke-opacity=".05" stroke-width="2">
      <path d="M0 70 H512 M0 118 H512 M0 166 H512 M0 214 H512 M0 262 H512 M0 310 H512 M0 358 H512"/>
    </g>
    <!-- weld crack behind the letter -->
    <path d="M70 120 L150 168 L132 214 L214 262 M440 110 L380 170 L404 220 L330 260" fill="none" stroke="#ff5a1a" stroke-width="5" stroke-linejoin="round" opacity=".8"/>
    <!-- rivets with rust bleeding down -->
    <g>
      <path d="M86 92 q-6 34 -2 60 l6 0 q2 -28 -4 -60z M426 92 q-6 34 -2 60 l6 0 q2 -28 -4 -60z" fill="#8a3b12" opacity=".7"/>
      <circle cx="88" cy="88" r="15" fill="#2a2d34"/><circle cx="88" cy="88" r="11" fill="#c7ccd5"/><circle cx="85" cy="85" r="4" fill="#ffffff"/>
      <circle cx="424" cy="88" r="15" fill="#2a2d34"/><circle cx="424" cy="88" r="11" fill="#c7ccd5"/><circle cx="421" cy="85" r="4" fill="#ffffff"/>
    </g>
    <!-- the V: extrusion steps down into molten, then the chrome face and its black cut-out -->
    <g transform="skewX(-10) translate(46 0)">
      <path d="M126 112 H210 L262 300 L314 112 H398 L304 404 H220 Z" fill="url(#molten)" transform="translate(0 26)"/>
      <path d="M126 112 H210 L262 300 L314 112 H398 L304 404 H220 Z" fill="#ff5a1a" transform="translate(0 14)"/>
      <path d="M126 112 H210 L262 300 L314 112 H398 L304 404 H220 Z" fill="url(#chrome)" stroke="#0d0e12" stroke-width="14" stroke-linejoin="round"/>
      <path d="M150 128 H198 L232 252" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity=".7"/>
    </g>
    <!-- hazard band -->
    <rect x="0" y="430" width="512" height="82" fill="url(#haz)"/>
    <rect x="0" y="424" width="512" height="10" fill="#0d0e12"/>
  </g>
</svg>
